version: '3'

vars:
  LOREIN_INTERNAL: ".lorein"

includes:
  env:
    taskfile: .tasks/env.task.yaml
    vars:
      LOREIN_INTERNAL: "{{.LOREIN_INTERNAL}}"
    optional: false
  vcs:
    taskfile: .tasks/vcs.task.yaml
    optional: false

tasks:
  default:
    cmds:
      - task --list

  init:
    desc: "Intelligently enforces infrastructure routing and state synchronization"
    cmds:
      - mkdir -p {{.LOREIN_INTERNAL}}
      - task: env:init-env

  realign:
    desc: "Fixes broken submodule paths and VCS name changes without deleting local folders"
    cmds:
      - task: env:realign-submodules

  repair:
    desc: "Automates non-destructive repair for any targeted submodule layer"
    summary: |
      Usage:
        task repair SUBMODULE_PATH="<path>" SUBMODULE_URL="<url>"
    cmds:
      - task: vcs:repair-submodule
        vars:
          SUBMODULE_PATH: "{{.SUBMODULE_PATH}}"
          SUBMODULE_URL: "{{.SUBMODULE_URL}}"

  env:init:
    desc: "[L-TDD] Initialise proprement la sandbox centrale et configure le routage d'identité modulaire"
    cmds:
      - powershell -ExecutionPolicy Bypass -File ./.tasks/bootstrap-env.ps1

  test:env:
    desc: "[L-TDD] Exécute l'analyse d'assertion de notre routeur d'environnement modulaire"
    cmds:
      - powershell -ExecutionPolicy Bypass -File ./tests/test-env-routing.ps1