version: '3'

tasks:
  default:
    cmds:
      - task --list
    silent: true

  repair-submodule:
    desc: "Safely backups, purges, and re-initializes a corrupted submodule link"
    internal: true
    cmds:
      # Step 0: Fail-Fast Hardlocking Verification
      - |
        set -euo pipefail
        if [ -z "{{.SUBMODULE_PATH}}" ] || [ -z "{{.SUBMODULE_URL}}" ]; then
          echo "[FATAL] Execution blocked: SUBMODULE_PATH or SUBMODULE_URL variable is undefined."
          exit 1
        fi

      - echo "[INFO] Initializing safe migration protocol for {{.SUBMODULE_PATH}}..."
      
      # Step 1: Secure local files into an isolated sandbox without using unsafe OS flags
      - |
        set -euo pipefail
        _backup_dir="../_Lorein_Backup_Workspace"
        _has_files=false
        
        if [ -d "{{.SUBMODULE_PATH}}" ]; then
          # Safe cross-platform folder evaluation using loop expansions
          for _file in "{{.SUBMODULE_PATH}}/"*; do
            if [ -e "$_file" ]; then
              _has_files=true
              break
            fi
          done
        fi

        if [ "$_has_files" = true ]; then
          echo "[INFO] Backing up untracked local assets..."
          mkdir -p "$_backup_dir"
          cp -r "{{.SUBMODULE_PATH}}"/. "$_backup_dir/" 2>/dev/null || true
        else
          echo "[INFO] Target directory is empty or missing. Skipping asset backup."
        fi

      # Step 2: Evict corrupted tracking references from Git cache layers
      - git rm --cached -r "{{.SUBMODULE_PATH}}" -f || true
      - rm -rf ".git/modules/{{.SUBMODULE_PATH}}"
      - rm -rf "{{.SUBMODULE_PATH}}"

      # Step 3: Establish the formal cryptographic SHA-1 pointer hash link
      - git submodule add --force "{{.SUBMODULE_URL}}" "{{.SUBMODULE_PATH}}"

      # Step 4: Restore user assets into the healthy child context repository space
      - |
        set -euo pipefail
        _backup_dir="../_Lorein_Backup_Workspace"
        if [ -d "$_backup_dir" ]; then
          echo "[INFO] Restoring local assets into the newly mapped submodule..."
          cp -r "$_backup_dir"/. "{{.SUBMODULE_PATH}}/" 2>/dev/null || true
          rm -rf "$_backup_dir"
        fi
      - echo "[SUCCESS] {{.SUBMODULE_PATH}} successfully aligned and restored."
