  cp-config:
    desc: "Synchronizes the global configuration baseline (with fallback to sparse-checkout)"
    internal: true
    cmds:
      - |
        set -euo pipefail
        SOURCE_FILE="{{.REGISTRY_SUBMODULE}}/{{.GLOBAL_CONFIG_NAME}}"
        DEST_FILE="{{.LOREIN_INTERNAL}}/{{.GLOBAL_CONFIG_NAME}}"

        mkdir -p "{{.LOREIN_INTERNAL}}"

        if [ -f "$SOURCE_FILE" ]; then
          echo "[INFO] Registry submodule found. Syncing configuration..."
          cp "$SOURCE_FILE" "$DEST_FILE"
        else
          echo "[WARN] Submodule missing. Triggering ephemeral sparse-checkout..."
          
          _tmp_dir="{{.LOREIN_INTERNAL}}/tmp"
          mkdir -p "$_tmp_dir"
          
          # Le trap ne doit s'activer que si le script se termine, mais on gère le flux proprement
          trap "rm -rf '$_tmp_dir'" EXIT 

          cd "$_tmp_dir"
          git init -q
          git remote add origin "{{.REGISTRY_REMOTE_URL}}"
          git config core.sparseCheckout true
          echo "{{.GLOBAL_CONFIG_NAME}}" > .git/info/sparse-checkout
          
          # Utilisation d'un opérateur OU (||) pour capturer l'échec réseau sans faire crasher le script immédiatement
          git pull --depth=1 origin main -q || echo "[ERROR] Failed to fetch assets from remote repository."
          
          cd - > /dev/null
          
          # Vérification explicite de l'existence du fichier avant la copie pour un diagnostic propre
          if [ -f "$_tmp_dir/{{.GLOBAL_CONFIG_NAME}}" ]; then
            cp "$_tmp_dir/{{.GLOBAL_CONFIG_NAME}}" "$DEST_FILE"
            echo "[SUCCESS] Configuration synchronized via sparse-checkout."
          else
            echo "[FATAL] Ephemeral synchronization failed: File not found on remote registry."
            exit 1
          fi
        fi
