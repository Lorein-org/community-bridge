version: '3'

vars:
  REGISTRY_SUBMODULE: "submodules/gov-work-registry"
  REGISTRY_REMOTE_URL: "https://github.com/Lorein-org/gov-work-registry"
  GLOBAL_CONFIG_NAME: ".gitconfig.global"
  TARGET_GITCONFIG: "../.gitconfig"
  LOREIN_INTERNAL: "{{.LOREIN_INTERNAL | default \".lorein\"}}"

tasks:
  default:
    cmds:
      - task --list
    silent: true

  init-env:
    desc: "Initializes the environment by syncing config and generating the context switcher"
    cmds:
      - task: cp-config
      - task: generate-switcher

  cp-config:
    desc: "Synchronizes the global configuration baseline (with fallback to sparse-checkout)"
    internal: true
    cmds:
      - |
        set -euo pipefail
        SOURCE_FILE="{{.REGISTRY_SUBMODULE}}/{{.GLOBAL_CONFIG_NAME}}"
        DEST_FILE="{{.LOREIN_INTERNAL}}/{{.GLOBAL_CONFIG_NAME}}"

        mkdir -p "{{.LOREIN_INTERNAL}}"

        if [ -f "$SOURCE_FILE" ]; then
          echo "[INFO] Registry submodule found. Syncing configuration..."
          cp "$SOURCE_FILE" "$DEST_FILE"
        else
          echo "[WARN] Submodule missing. Triggering ephemeral sparse-checkout..."
          
          _tmp_dir="{{.LOREIN_INTERNAL}}/tmp"
          mkdir -p "$_tmp_dir"
          trap "rm -rf '$_tmp_dir'" EXIT 

          cd "$_tmp_dir"
          git init -q
          git remote add origin "{{.REGISTRY_REMOTE_URL}}"
          git config core.sparseCheckout true
          echo "{{.GLOBAL_CONFIG_NAME}}" > .git/info/sparse-checkout
          
          # Extraction réseau sécurisée
          git pull --depth=1 origin main -q || echo "[ERROR] Failed to fetch assets from remote repository."
          
          cd - > /dev/null
          
          if [ -f "$_tmp_dir/{{.GLOBAL_CONFIG_NAME}}" ]; then
            cp "$_tmp_dir/{{.GLOBAL_CONFIG_NAME}}" "$DEST_FILE"
            echo "[SUCCESS] Configuration synchronized via sparse-checkout."
          else
            echo "[FATAL] Ephemeral synchronization failed: File not found on remote registry."
            exit 1
          fi
        fi

  generate-switcher:
    desc: "Generates the root .gitconfig switcher based on ecosystem context"
    internal: true
    vars:
      INTERNAL_PATH: "community-bridge/{{.LOREIN_INTERNAL}}/{{.GLOBAL_CONFIG_NAME}}"
    cmds:
      - |
        set -euo pipefail
        TARGET="{{.TARGET_GITCONFIG}}"
        
        > "$TARGET"
        
        if [ -d "../ecosystem-hub" ]; then
          echo "[SYSTEM] Private Enterprise Context detected (Master Mode)."
          
          echo "# ==============================================================================" >> "$TARGET"
          echo "# LOREIN INFRASTRUCTURE - ROOT CONTEXT SWITCHER (MASTER MODE)" >> "$TARGET"
          echo "# ==============================================================================" >> "$TARGET"
          echo "" >> "$TARGET"
          echo "[include]" >> "$TARGET"
          echo "    path = {{.INTERNAL_PATH}}" >> "$TARGET"
          echo "" >> "$TARGET"
          echo "# 2. Private Enterprise Perimeter" >> "$TARGET"
          echo "[includeIf \"gitdir/i:**/lorein/ecosystem-hub/\"]" >> "$TARGET"
          echo "    path = ecosystem-hub/.gitconfig.priv" >> "$TARGET"
          echo "" >> "$TARGET"
          echo "# 3. Public Community Perimeter" >> "$TARGET"
          echo "[includeIf \"gitdir/i:**/lorein/community-bridge/\"]" >> "$TARGET"
          echo "    path = community-bridge/.gitconfig.pub" >> "$TARGET"
        else
          echo "[SYSTEM] Public Isolated Context detected (Worker Mode)."
          
          echo "# ==============================================================================" >> "$TARGET"
          echo "# LOREIN INFRASTRUCTURE - ROOT CONTEXT SWITCHER (WORKER MODE)" >> "$TARGET"
          echo "# ==============================================================================" >> "$TARGET"
          echo "" >> "$TARGET"
          echo "[include]" >> "$TARGET"
          echo "    path = {{.INTERNAL_PATH}}" >> "$TARGET"
          echo "" >> "$TARGET"
          echo "# 2. Public Community Perimeter" >> "$TARGET"
          echo "[includeIf \"gitdir/i:**/lorein/community-bridge/\"]" >> "$TARGET"
          echo "    path = community-bridge/.gitconfig.pub" >> "$TARGET"
        fi
        
        echo "[SUCCESS] Environmental routing generated at $TARGET."
